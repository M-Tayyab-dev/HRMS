name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hrms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgres://postgres:ci-superuser@localhost:5432/hrms
      DATABASE_URL: postgres://hrms_app:ci-app@localhost:5432/hrms
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-0123
      DATA_HMAC_SECRET: ci-hmac-secret-ci-hmac-secret-ci-hmac-secret-01
      COOKIE_SECURE: 'false'
      ENABLE_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck
      - run: npm test -w @hrms/api
      - run: npm run build -w @hrms/api
      - run: npm run build -w @hrms/web
      - name: Create app role and migrate
        run: |
          psql "$DATABASE_ADMIN_URL" -c "CREATE ROLE hrms_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-app'"
          npm run db:migrate -w @hrms/api
      - name: End-to-end workflow tests
        run: |
          (cd apps/api && NODE_ENV=development node dist/main.js &)
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && break; sleep 1; done
          node scripts/smoke.mjs
          node scripts/e2e-flows.mjs
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
